# Portable C-R2 profile. Runtime paths are taken from configs/local/paths.yaml.
seed: 20260730
window_length: 8
overlap: 4
phase1_maxiter: 12
phase2_maxiter: 80
timeout_seconds: 1800
target_gap_m: 0.001
penetration_margin_m: 0.0005
collision_refinement:
  # Resolve any remaining real MuJoCo contact after bounded Powell, before
  # visual refinement. This is local to the responsible hand link and frame.
  target_max_penetration_m: 0.0025
  clearance_m: 0.0002
  max_iterations: 3
  max_joint_step: 0.05
  damping: 1.0e-5
visual_refinement:
  # A separate real-object visual-mesh gate closes mesh-contact blind spots;
  # it is a bounded local correction, never a global hand translation.
  target_clearance_m: 0.001
  max_iterations: 4
  max_joint_step: 0.05
  damping: 1.0e-5
wrist_translation_bound_m: 0.015
wrist_rotation_bound_rad: 0.17453292519943295
# C-XAR: the Stage-B wrist/root pose is a frozen upstream geometric contract.
# Contact correction may articulate fingers, but it must not use whole-hand
# translation or rotation as an escape route.  A separately reviewed profile
# may opt in to wrist correction; the default must remain fail-closed.
allow_wrist_correction: false
weights:
  penetration: 300000.0
  contact: 5000.0
  fingertip: 30.0
  wrist_position: 30.0
  wrist_rotation: 15.0
  posture: 0.1
  velocity: 0.25
  acceleration: 0.05
acceptance:
  max_collision_penetration_m: 0.003
  max_visual_penetration_m: 0.003
  fingertip_rmse_m: 0.08
  wrist_rmse_m: 0.03
  contact_recall: 0.70
