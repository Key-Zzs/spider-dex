# Stage C-V2R is deliberately separate from the preserved failed C-V2 profile.
# It consumes the immutable C-XA Level-1 input and writes only stage_c_v2r
# evidence.  The original 120-Hz duration is a hard contract in this profile.
profile_name: grab_wuji_stage_c_v2r
base_dynamic_config: configs/project/grab_wuji_stage_c_v2_dynamic.yaml
contract_path: configs/project/grab_wuji_stage_c_contract_v2.yaml
corrected_namespace: stage_c_contract_v2_cxa
corrected_level: 1
seed: 20260731
timing:
  variant: V2_ORIGINAL_TIMING
  scale: 1.0
  source_fps: 120.0
physics:
  sim_timestep_s: 0.0005
  object_mocap_solref_s: 0.001
  # Oracle C uses a much stiffer mocap weld but never writes object qpos.
  oracle_c_kinematic_mocap_solref_s: 0.0001
  robot_reference_lead_source_frames: 20
  source_interval_scheduler: exact_accumulated_120hz
oracle:
  patch_distance_m: 0.020
  patch_coverage: 0.70
  functional_role_recall: 0.80
  normal_cosine: 0.50
  max_normalized_joint_delta: 0.25
  max_robot_velocity_rad_s: 100.0
  max_robot_acceleration_rad_s2: 20000.0
  max_robot_jerk_rad_s3: 3000000.0
  min_joint_margin_fraction: 0.001
  collision_depth_m: 0.003
  force_spike_n: 150.0
  stable_hold_force_p95_multiplier: 2.0
  stable_hold_force_max_multiplier: 1.0
  stable_hold_force_impulse_multiplier: 1.0
  object_position_max_m: 0.08
  object_rotation_max_rad: 0.50
  wrist_rmse_m: 0.03
  fingertip_rmse_m: 0.08
