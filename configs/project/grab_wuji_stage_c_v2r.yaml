  object_guidance_candidates: []
  # Frozen Branch-D candidates.  They modify only explicit hand-object MuJoCo
  # pair parameters in memory; controller gains, source object targets, and
  # C-XA qpos stay fixed.  No negative margin/gap is allowed.
