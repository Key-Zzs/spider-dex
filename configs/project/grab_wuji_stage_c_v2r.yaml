  # it did not meet the required joint-specific-controller audit scope.
  controller_candidates:
    - {lead_source_frames: 0, kp_scale: 1.00, kv_scale: 1.00, force_limit_scale: 1.00}
    - {lead_source_frames: 8, kp_scale: 1.00, kv_scale: 1.00, force_limit_scale: 1.00}
    - {lead_source_frames: 16, kp_scale: 1.00, kv_scale: 1.00, force_limit_scale: 1.00}
    - {lead_source_frames: 20, kp_scale: 1.00, kv_scale: 1.00, force_limit_scale: 1.00}
    - {lead_source_frames: 8, kp_scale: 1.00, kv_scale: 1.00, force_limit_scale: 1.00, joint_kp_overrides: {37: 0.75, 38: 0.75, 41: 0.75}}
    - {lead_source_frames: 8, kp_scale: 1.00, kv_scale: 1.00, force_limit_scale: 1.00, joint_kp_overrides: {37: 1.25, 38: 1.25, 41: 1.25}}
