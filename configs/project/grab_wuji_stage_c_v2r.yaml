    - {candidate_id: soft_30ms, solref: [0.030, 1.00], solimp: [0.80, 0.90, 0.002, 0.50, 2.00], margin_m: 0.0000, gap_m: 0.0000, friction: [1.00, 1.00, 0.10, 0.00, 0.00]}
