  max_candidates_per_branch: 12
  timeout_s: 900
  # Fixed before the formal R2 search.  Each candidate changes only the real
  # position-controller profile; source frames, C-XA qpos, object guidance,
  # and contact parameters stay immutable in this branch.  The first scalar
